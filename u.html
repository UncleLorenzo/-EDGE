<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trader profile · $EDGE</title>
<meta name="description" content="A prediction-market trader on $EDGE — PFP, track record, and every bet they place, live. Follow the sharps.">
<meta property="og:type" content="profile">
<meta name="theme-color" content="#050507">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=JetBrains+Mono:wght@400;500;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/lib/client/elite.css">
<script defer src="/lib/client/elite.js"></script>
<script defer src="/lib/client/ticker.js"></script>
<script defer src="/lib/client/palette.js"></script>
<style>
:root {
  --void: #050507; --void-2: #0c0c10; --void-3: #141418; --void-4: #1c1c22;
  --lime: #C4FF00; --magenta: #FF006E; --green: #00FF85; --amber: #FFB800;
  --red: #FF3344; --white: #F5F5F0; --muted: #6B6B73;
  --border: rgba(245,245,240,0.08); --border-bright: rgba(196,255,0,0.2);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { background: var(--void); color: var(--white); font-family: 'DM Sans', sans-serif; font-variant-numeric: tabular-nums; min-height: 100vh; }
body::before { content: ''; position: fixed; inset: -20%; z-index: 0; pointer-events: none; background: radial-gradient(40% 34% at 30% 0%, rgba(196,255,0,.07), transparent 70%); filter: blur(24px); }
header, main { position: relative; z-index: 2; }
main.profile { max-width: 880px; margin: 0 auto; padding: 22px 16px 80px; }
a { color: inherit; }

/* hero */
.pf-hero { display: flex; gap: 18px; align-items: flex-start; padding: 8px 4px 20px; flex-wrap: wrap; }
.pf-pic { width: 92px; height: 92px; border-radius: 50%; flex: 0 0 auto; overflow: hidden; background: var(--void-3); border: 2px solid var(--border-bright); display: flex; align-items: center; justify-content: center; font-family: 'Anton', sans-serif; font-size: 38px; color: var(--lime); }
.pf-pic img { width: 100%; height: 100%; object-fit: cover; }
.pf-id { flex: 1 1 240px; min-width: 0; }
.pf-name { font-family: 'Anton', sans-serif; font-size: clamp(28px, 6vw, 40px); line-height: 1; }
.pf-sub { display: flex; align-items: center; gap: 9px; margin-top: 8px; flex-wrap: wrap; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); }
.pf-rank { color: var(--amber); font-weight: 700; border: 1px solid rgba(255,184,0,.3); border-radius: 6px; padding: 3px 8px; background: rgba(255,184,0,.05); }
.pf-wallet { cursor: pointer; border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; }
.pf-wallet:hover { border-color: var(--border-bright); color: var(--white); }
.pf-poly { color: var(--green); }
.pf-bio { color: var(--white); opacity: .85; font-size: 14px; line-height: 1.5; margin-top: 10px; max-width: 480px; }
.pf-actions { display: flex; gap: 9px; align-items: center; flex: 0 0 auto; }
.pf-follow { font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; letter-spacing: .02em; padding: 10px 20px; border-radius: 100px; cursor: pointer; border: 1px solid var(--lime); background: var(--lime); color: var(--void); transition: .15s; }
.pf-follow.on { background: transparent; color: var(--white); border-color: var(--border); }
.pf-follow.on::before { content: "✓ "; color: var(--green); }
.pf-follow:hover { transform: translateY(-1px); }
.pf-ext { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--muted); text-decoration: none; border: 1px solid var(--border); border-radius: 100px; padding: 10px 14px; }
.pf-ext:hover { border-color: var(--border-bright); color: var(--white); }

/* stats */
.pf-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; margin-bottom: 18px; }
.pf-stat { background: var(--void-2); padding: 13px 15px; }
.pf-stat .l { font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.pf-stat .v { font-family: 'Anton', sans-serif; font-size: 25px; line-height: 1; }
.pf-stat .v.pos { color: var(--green); } .pf-stat .v.neg { color: var(--red); } .pf-stat .v.alt { color: var(--lime); }

/* tabs */
.pf-tabs { display: inline-flex; gap: 3px; background: var(--void-2); border: 1px solid var(--border); border-radius: 10px; padding: 3px; margin-bottom: 14px; }
.pf-tabs button { background: transparent; border: none; color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 600; padding: 7px 15px; border-radius: 7px; cursor: pointer; }
.pf-tabs button.active { color: var(--void); background: var(--lime); }

/* rows */
.pf-body { display: flex; flex-direction: column; gap: 8px; }
.pf-empty, .pf-loading { text-align: center; color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 13px; padding: 50px 20px; }
.bet-row { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; background: var(--void-2); border: 1px solid var(--border); border-radius: 12px; padding: 12px 15px; text-decoration: none; transition: border-color .15s; }
.bet-row:hover { border-color: var(--border-bright); }
.bet-side { font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; padding: 4px 9px; border-radius: 6px; white-space: nowrap; }
.bet-side.buy { color: var(--green); background: rgba(0,255,133,.1); } .bet-side.sell { color: var(--magenta); background: rgba(255,0,110,.1); }
.bet-mid { min-width: 0; }
.bet-mkt { font-size: 13.5px; font-weight: 600; line-height: 1.3; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.bet-meta { font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: var(--muted); margin-top: 3px; }
.bet-amt { text-align: right; white-space: nowrap; }
.bet-amt .v { font-family: 'Anton', sans-serif; font-size: 18px; }
.bet-amt .t { font-family: 'JetBrains Mono', monospace; font-size: 9px; color: var(--muted); display: block; }
.pos-pnl.pos { color: var(--green); } .pos-pnl.neg { color: var(--red); }
.pf-toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%) translateY(16px); opacity: 0; z-index: 70; background: rgba(12,12,16,.97); border: 1px solid var(--border-bright); border-radius: 10px; padding: 9px 16px; font-family: 'JetBrains Mono', monospace; font-size: 12px; transition: .25s; pointer-events: none; }
.pf-toast.in { transform: translateX(-50%) translateY(0); opacity: 1; }
@media (max-width: 560px) { .pf-stats { grid-template-columns: 1fr 1fr; } .pf-actions { width: 100%; } .pf-follow { flex: 1; text-align: center; } }
</style>
</head>
<body>
<header class="elite-nav site-nav">
  <a class="logo" href="/"><span class="dollar">$</span><span class="word">EDGE</span></a>
  <nav><ul></ul></nav>
  <div class="nav-right">
    <a class="btn btn-app" href="/feed.html">Your Feed</a>
    <a class="btn btn-ghost" href="/token.html">Buy $EDGE</a>
  </div>
</header>

<main class="profile">
  <div id="pfRoot"><div class="pf-loading">Loading profile…</div></div>
</main>

<div class="pf-toast" id="pfToast"></div>

</body>
</html>
